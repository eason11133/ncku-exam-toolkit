<svg xmlns="http://www.w3.org/2000/svg" width="700" height="130" viewBox="0 0 700 130" role="img" aria-labelledby="title desc">
<title id="title">Transfer Engine 四階段</title>
<desc id="desc">先配置來源、目的、count 等設定，再啟動，等待搬運完成，最後讀取結果並釋放通道。</desc>
<rect width="700" height="130" fill="#fff" rx="10"/>
<g font-family="Noto Sans CJK TC, Microsoft JhengHei, Arial, sans-serif" text-anchor="middle" fill="#243b4b">
<g fill="#e6f0f4" stroke="#b4d0d9"><rect x="17" y="37" width="144" height="54" rx="7"/><rect x="192" y="37" width="144" height="54" rx="7"/><rect x="367" y="37" width="144" height="54" rx="7"/><rect x="542" y="37" width="144" height="54" rx="7"/></g>
<g font-size="17"><text x="89" y="62">設定</text><text x="264" y="62">啟動</text><text x="439" y="62">等待完成</text><text x="614" y="62">取結果／釋放</text></g>
<g font-size="12" fill="#657c88"><text x="89" y="80">count / size</text><text x="264" y="80">start</text><text x="439" y="80">wait / busy</text><text x="614" y="80">read / release</text></g>
<g stroke="#718c9e" stroke-width="2" fill="none"><path d="M161 64h25m-6-6 6 6-6 6M336 64h25m-6-6 6 6-6 6M511 64h25m-6-6 6 6-6 6"/></g>
</g></svg>
